<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe Tracker - Discover Local Vibes & Events</title>
    <meta
      name="description"
      content="Discover local places with great vibes, and find events that match your vibess."
    />
    <meta name="keywords" content="vibe tracker, mood tracking, local events" />
    <meta name="author" content="Vibe Tracker" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Hamburger Menu -->
      <button
        class="hamburger-menu"
        aria-label="Open navigation menu"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Side Navigation -->
      <nav class="side-nav" aria-label="Main navigation">
        <ul>
          <li>
            <a href="index.html" class="nav-link active" aria-current="page"
              >Home</a
            >
          </li>
          <li><a href="vibes.html" class="nav-link">Vibes</a></li>
          <li><a href="add-vibe.html" class="nav-link">Add Vibe</a></li>
          <li><a href="vibe-check.html" class="nav-link">Vibe Check</a></li>
          <li><a href="favourites.html" class="nav-link">Favourites</a></li>
        </ul>
      </nav>

      <!-- Overlay -->
      <div class="overlay"></div>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Logo -->
        <div class="logo-container">
          <h1 class="logo">Whut's the Vibe?</h1>
        </div>

        <!-- Main Window with Tabs -->
        <section class="main-window" aria-label="Main content area">
          <div class="tab-container" role="tablist" aria-label="Content tabs">
            <button
              class="tab active"
              role="tab"
              aria-selected="true"
              aria-controls="places-panel"
              id="places-tab"
            >
              PLACES
            </button>
            <button
              class="tab"
              role="tab"
              aria-selected="false"
              aria-controls="plans-panel"
              id="plans-tab"
            >
              PLANS
            </button>
          </div>
          <div class="window-content">
            <div
              class="tab-panel active"
              role="tabpanel"
              aria-labelledby="places-tab"
              id="places-panel"
            >
              <button class="reset-btn" aria-label="Clear map highlights">
                Reset
              </button>
              <div class="map-container">
                <img
                  src="map-mockup.png"
                  alt="Interactive map showing places"
                  class="map-image"
                />
                <canvas
                  class="highlight-canvas"
                  width="800"
                  height="600"
                ></canvas>
                <div class="vibe-indicators">
                  <div
                    class="vibe-dot"
                    style="top: 30%; left: 25%; background-color: #ff6b6b"
                  ></div>
                  <div
                    class="vibe-dot"
                    style="top: 45%; left: 60%; background-color: #4ecdc4"
                  ></div>
                  <div
                    class="vibe-dot"
                    style="top: 70%; left: 40%; background-color: #45b7d1"
                  ></div>
                  <div
                    class="vibe-dot"
                    style="top: 55%; left: 75%; background-color: #96ceb4"
                  ></div>
                  <div
                    class="vibe-dot"
                    style="top: 35%; left: 80%; background-color: #feca57"
                  ></div>
                </div>
              </div>
            </div>
            <div
              class="tab-panel"
              role="tabpanel"
              aria-labelledby="plans-tab"
              id="plans-panel"
            >
              <button class="reset-btn" aria-label="Clear map highlights">
                Reset
              </button>
              <div class="map-container">
                <img
                  src="map-mockup.png"
                  alt="Interactive map showing plans"
                  class="map-image"
                />
                <canvas
                  class="highlight-canvas"
                  width="800"
                  height="600"
                ></canvas>
                <div class="vibe-indicators">
                  <div
                    class="vibe-dot"
                    style="top: 25%; left: 35%; background-color: #ff9ff3"
                  ></div>
                  <div
                    class="vibe-dot"
                    style="top: 50%; left: 50%; background-color: #54a0ff"
                  ></div>
                  <div
                    class="vibe-dot"
                    style="top: 65%; left: 30%; background-color: #5f27cd"
                  ></div>
                  <div
                    class="vibe-dot"
                    style="top: 40%; left: 70%; background-color: #00d2d3"
                  ></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Bottom Buttons -->
        <section class="bottom-buttons" aria-label="Action buttons">
          <button
            class="action-btn"
            data-action="down"
            aria-label="Filter"
          >
            <span class="icon">🔻</span>
            <span class="btn-label">Filter</span>
          </button>
          <button
            class="action-btn"
            data-action="add"
            aria-label="Add new item"
          >
            <span class="icon">➕</span>
            <span class="btn-label">Add</span>
          </button>
          <button class="action-btn" data-action="search" aria-label="Search">
            <span class="icon">🔍</span>
            <span class="btn-label">Search</span>
          </button>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>

    <style>
      /* Reset and Base Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* Colors */
        --background-color: #ffffff;
        --border-color: #000000;
        --text-color: #000000;
        --selected-gradient: linear-gradient(
          45deg,
          #ff0000,
          #ff7f00,
          #ffff00,
          #00ff00,
          #0000ff,
          #4b0082,
          #9400d3
        );
        --tab-background: #f8f8f8;
        --tab-active-background: #ffffff;

        /* Spacing */
        --padding-small: 8px;
        --padding-medium: 16px;
        --padding-large: 24px;

        /* Border radius */
        --border-radius-window: 12px;
        --border-radius-tabs: 12px 12px 0 0;
        --border-radius-none: 0;

        /* Transitions */
        --transition-fast: 0.2s ease;
        --transition-medium: 0.3s ease;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background-color: var(--background-color);
        color: var(--text-color);
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        min-height: 100vh;
        min-height: 100dvh;
        position: relative;
      }

      /* Layout */
      .app-container {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 100vw;
        overflow: hidden;
      }

      /* Hamburger Menu */
      .hamburger-menu {
        position: fixed;
        top: var(--padding-medium);
        left: var(--padding-medium);
        z-index: 1001;
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 24px;
        height: 18px;
      }

      .hamburger-menu span {
        display: block;
        height: 2px;
        width: 100%;
        background-color: var(--border-color);
        transition: var(--transition-medium);
      }

      .hamburger-menu.active span:nth-child(1) {
        transform: rotate(45deg) translate(5px, 5px);
      }

      .hamburger-menu.active span:nth-child(2) {
        opacity: 0;
      }

      .hamburger-menu.active span:nth-child(3) {
        transform: rotate(-45deg) translate(7px, -6px);
      }

      /* Side Navigation */
      .side-nav {
        position: fixed;
        top: 0;
        left: -280px;
        width: 280px;
        height: 100vh;
        height: 100dvh;
        background-color: var(--background-color);
        border-right: 2px solid var(--border-color);
        z-index: 1000;
        transition: var(--transition-medium);
        padding-top: 80px;
        overflow-y: auto;
      }

      .side-nav.active {
        left: 0;
      }

      .side-nav ul {
        list-style: none;
        padding: var(--padding-large);
      }

      .side-nav li {
        margin-bottom: var(--padding-medium);
      }

      .nav-link {
        display: block;
        padding: var(--padding-medium);
        text-decoration: none;
        color: var(--text-color);
        font-weight: 500;
        font-size: 18px;
        border: 1px solid var(--border-color);
        transition: var(--transition-fast);
        text-align: center;
      }

      .nav-link:hover,
      .nav-link:focus {
        background-color: #f5f5f5;
      }

      .nav-link.active {
        background: var(--selected-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: 600;
      }

      /* Overlay */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 999;
        opacity: 0;
        visibility: hidden;
        transition: var(--transition-medium);
      }

      .overlay.active {
        opacity: 1;
        visibility: visible;
      }

      /* Main Content */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: var(--padding-medium);
        padding-top: calc(var(--padding-large) + 40px);
        max-width: 100vw;
      }

      /* Logo */
      .logo-container {
        text-align: center;
        margin-bottom: var(--padding-large);
      }

      .logo {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
        background: var(--selected-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Main Window */
      .main-window {
        flex: 1;
        border: 4px solid var(--border-color);
        border-radius: var(--border-radius-window);
        margin-bottom: var(--padding-large);
        display: flex;
        flex-direction: column;
        min-height: 50vh;
        max-height: 70vh;
        overflow: hidden;
      }

      /* Window Content */
      .window-content {
        flex: 1;
        padding: var(--padding-large);
        display: flex;
        flex-direction: column;
        gap: var(--padding-large);
        overflow-y: auto;
      }

      .page-title {
        font-size: 18px;
        font-weight: 600;
        text-align: center;
        margin-bottom: var(--padding-medium);
      }

      /* Color Wheel */
      .color-wheel-container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
        min-height: 250px;
        position: relative;
      }

      .color-wheel {
        position: relative;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid var(--border-color);
      }

      .segment {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-origin: center center;
        cursor: pointer;
      }

      .segment-inner {
        clip-path: polygon(50% 50%, 50% 25%, 93.3% 37.5%, 50% 50%);
      }

      .segment-outer {
        clip-path: polygon(50% 50%, 50% 0%, 93.3% 25%, 50% 50%);
      }

      .segment.selected {
        box-shadow: inset 0 0 0 3px var(--border-color);
        z-index: 10;
      }

      /* Big Party */
      .red-inner {
        background: radial-gradient(circle at center, #ffb3b3, #ff8a8a);
        transform: rotate(0deg);
      }
      .red-outer {
        background: radial-gradient(circle at center, #8b0000, #b22222);
        transform: rotate(0deg);
      }

      /* Serious Topics */
      .orange-inner {
        background: radial-gradient(circle at center, #ffd4aa, #ffbd80);
        transform: rotate(60deg);
      }
      .orange-outer {
        background: radial-gradient(circle at center, #cc4500, #ff6347);
        transform: rotate(60deg);
      }

      /* Play */
      .yellow-inner {
        background: radial-gradient(circle at center, #fff4aa, #ffeb80);
        transform: rotate(120deg);
      }
      .yellow-outer {
        background: radial-gradient(circle at center, #b8860b, #daa520);
        transform: rotate(120deg);
      }

      /* Hectic Nature */
      .green-inner {
        background: radial-gradient(circle at center, #b3ffb3, #8aff8a);
        transform: rotate(180deg);
      }
      .green-outer {
        background: radial-gradient(circle at center, #228b22, #32cd32);
        transform: rotate(180deg);
      }

      /* Anti-stress */
      .blue-inner {
        background: radial-gradient(circle at center, #b3b3ff, #8a8aff);
        transform: rotate(240deg);
      }
      .blue-outer {
        background: radial-gradient(circle at center, #191970, #4169e1);
        transform: rotate(240deg);
      }

      /* Eat and Drink */
      .purple-inner {
        background: radial-gradient(circle at center, #d4b3ff, #c28aff);
        transform: rotate(300deg);
      }
      .purple-outer {
        background: radial-gradient(circle at center, #4b0082, #8a2be2);
        transform: rotate(300deg);
      }

      /* Tooltip */
      .vibe-tooltip {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
        z-index: 20;
        white-space: nowrap;
      }

      .vibe-tooltip.show {
        opacity: 1;
      }

      /* Place Selection */
      .place-selection {
        display: flex;
        flex-direction: column;
        gap: var(--padding-small);
      }

      .place-selection label {
        font-weight: 600;
        font-size: 16px;
      }

      .place-selection select {
        padding: var(--padding-medium);
        border: 2px solid var(--border-color);
        border-radius: 6px;
        font-size: 16px;
        font-family: inherit;
        background-color: var(--background-color);
        color: var(--text-color);
      }

      .place-selection select:focus {
        outline: none;
        border-color: #4169e1;
      }

      .add-vibe-btn {
        padding: var(--padding-medium);
        border: 2px solid var(--border-color);
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        background-color: var(--background-color);
        color: var(--text-color);
        cursor: pointer;
        transition: var(--transition-fast);
        margin-top: var(--padding-small);
      }

      .add-vibe-btn:hover,
      .add-vibe-btn:focus {
        background-color: #f5f5f5;
      }

      .add-vibe-btn:active {
        transform: scale(0.98);
      }

      /* Selected Vibe Display */
      .selected-vibe {
        text-align: center;
        padding: var(--padding-medium);
        border: 2px solid var(--border-color);
        border-radius: 6px;
        background-color: var(--tab-background);
        display: none;
      }

      .selected-vibe.show {
        display: block;
      }

      .selected-vibe-name {
        font-weight: 600;
        font-size: 18px;
        margin-bottom: 4px;
      }

      .selected-vibe-description {
        font-size: 14px;
        opacity: 0.7;
      }

      /* Bottom Buttons */
      .bottom-buttons {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: auto;
      }

      .action-btn {
        flex: 1;
        max-width: 33.33%;
        height: 50px;
        background: none;
        border: 2px solid var(--border-color);
        cursor: pointer;
        transition: var(--transition-fast);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--padding-small);
        margin: 0 var(--padding-small);
        border-radius: 8px;
      }

      .action-btn:first-child {
        margin-left: 0;
      }

      .action-btn:last-child {
        margin-right: 0;
      }

      .action-btn .icon {
        font-size: 24px;
        transition: var(--transition-fast);
      }

      .action-btn.selected .icon {
        border: 1px solid var(--border-color);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .action-btn:hover,
      .action-btn:focus {
        background-color: #f5f5f5;
      }

      .action-btn:active {
        transform: scale(0.95);
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .main-content {
          padding: var(--padding-small);
          padding-top: calc(var(--padding-medium) + 40px);
        }

        .logo {
          font-size: 20px;
        }

        .color-wheel {
          width: 200px;
          height: 200px;
        }

        .action-btn .icon {
          font-size: 20px;
        }

        .wheel-segment {
          font-size: 10px;
        }
      }

      @media (max-width: 480px) {
        .window-content {
          padding: var(--padding-medium);
        }

        .color-wheel {
          width: 180px;
          height: 180px;
        }

        .wheel-segment {
          font-size: 9px;
        }
      }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        :root {
          --background-color: #000000;
          --border-color: #ffffff;
          --text-color: #ffffff;
          --tab-background: #1a1a1a;
          --tab-active-background: #000000;
        }

        .action-btn:hover,
        .action-btn:focus {
          background-color: #1a1a1a;
        }

        .place-selection select {
          background-color: var(--background-color);
          color: var(--text-color);
        }

        .add-vibe-btn {
          background-color: var(--background-color);
          color: var(--text-color);
        }

        .add-vibe-btn:hover,
        .add-vibe-btn:focus {
          background-color: #1a1a1a;
        }
      }
    </style>
  </head>

    <script>
      // Add Vibe Page JavaScript
      (function () {
        "use strict";

        // DOM Elements
        const hamburgerMenu = document.querySelector(".hamburger-menu");
        const sideNav = document.querySelector(".side-nav");
        const overlay = document.querySelector(".overlay");
        const colorWheel = document.getElementById("colorWheel");
        const wheelSegments = document.querySelectorAll(".segment");
        const vibeTooltip = document.getElementById("vibeTooltip");
        const placeSelect = document.getElementById("place-select");
        const addVibeBtn = document.getElementById("addVibeBtn");
        const actionButtons = document.querySelectorAll(".action-btn");

        let currentPlace = null;

        // Initialize app
        function init() {
          setupEventListeners();
          updateActiveNavLink();
        }

        // Setup all event listeners
        function setupEventListeners() {
          // Hamburger menu
          if (hamburgerMenu) {
            hamburgerMenu.addEventListener("click", toggleSideNav);
          }

          // Overlay
          if (overlay) {
            overlay.addEventListener("click", closeSideNav);
          }

          // Wheel segments
          wheelSegments.forEach((segment) => {
            segment.addEventListener("click", handleSegmentClick);
            segment.addEventListener("mouseenter", showTooltip);
            segment.addEventListener("mouseleave", hideTooltip);
            segment.addEventListener("touchstart", showTooltip, {
              passive: true,
            });
            segment.addEventListener("touchend", hideTooltip, {
              passive: true,
            });
          });

          // Place selection
          placeSelect.addEventListener("change", handlePlaceChange);

          // Add vibe button
          if (addVibeBtn) {
            addVibeBtn.addEventListener("click", handleAddVibeClick);
          }

          // Action buttons
          actionButtons.forEach((button) => {
            button.addEventListener("click", handleActionButtonClick);
          });

          // Escape key
          document.addEventListener("keydown", handleGlobalKeydown);
        }

        // Toggle side navigation
        function toggleSideNav() {
          const isActive = sideNav.classList.contains("active");

          if (isActive) {
            closeSideNav();
          } else {
            openSideNav();
          }
        }

        // Open side navigation
        function openSideNav() {
          sideNav.classList.add("active");
          overlay.classList.add("active");
          hamburgerMenu.classList.add("active");
          hamburgerMenu.setAttribute("aria-expanded", "true");
          document.body.style.overflow = "hidden";
        }

        // Close side navigation
        function closeSideNav() {
          sideNav.classList.remove("active");
          overlay.classList.remove("active");
          hamburgerMenu.classList.remove("active");
          hamburgerMenu.setAttribute("aria-expanded", "false");
          document.body.style.overflow = "";
        }

        // Handle segment clicks (now just for tooltips)
        function handleSegmentClick(e) {
          const segment = e.currentTarget;
          const name = segment.getAttribute("data-name");
          const description = segment.getAttribute("data-description");

          console.log(`Selected vibe: ${name} - ${description}`);
          showNotification(`Selected: ${name}`);
        }

        // Show tooltip
        function showTooltip(e) {
          const segment = e.currentTarget;
          const name = segment.getAttribute("data-name");

          vibeTooltip.textContent = name;
          vibeTooltip.classList.add("show");
        }

        // Hide tooltip
        function hideTooltip() {
          vibeTooltip.classList.remove("show");
        }

        // Handle place selection change
        function handlePlaceChange(e) {
          currentPlace = e.target.value;
          console.log(`Selected place: ${currentPlace}`);
        }

        // Handle add vibe button click
        function handleAddVibeClick() {
          if (currentPlace) {
            console.log(`Adding vibe at place: ${currentPlace}`);
            showNotification(
              `Vibe added at ${
                placeSelect.options[placeSelect.selectedIndex].text
              }!`
            );

            // Navigate back to home after a delay
            setTimeout(() => {
              window.location.href = "index.html";
            }, 1500);
          } else {
            showNotification("Please select a place first!");
          }
        }

        // Handle action button clicks
        function handleActionButtonClick(e) {
          const button = e.currentTarget;
          const action = button.getAttribute("data-action");

          handleAction(action, button);
        }

        // Handle specific actions
        function handleAction(action, button) {
          switch (action) {
            case "save":
              if (!addVibeBtn.disabled) {
                addVibe();
              }
              break;
            case "cancel":
              // Navigate back or reset
              if (window.history.length > 1) {
                window.history.back();
              } else {
                window.location.href = "index.html";
              }
              break;
            case "photo":
              console.log("Photo action - not implemented yet");
              showNotification("Photo feature coming soon!");
              break;
            default:
              console.log(`Action ${action} not implemented yet`);
          }
        }

        // Add vibe
        function addVibe() {
          const vibeData = {
            vibe: currentVibe,
            place: currentPlace,
            timestamp: new Date().toISOString(),
          };

          console.log("Adding vibe:", vibeData);
          showNotification("Vibe added successfully!");

          // Navigate back to home after a delay
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);
        }

        // Update active navigation link
        function updateActiveNavLink() {
          const currentPage =
            window.location.pathname.split("/").pop() || "index.html";
          const navLinks = document.querySelectorAll(".nav-link");

          navLinks.forEach((link) => {
            link.classList.remove("active");
            link.removeAttribute("aria-current");

            const linkHref = link.getAttribute("href");
            if (
              linkHref === currentPage ||
              (currentPage === "add-vibe.html" && linkHref === "add-vibe.html")
            ) {
              link.classList.add("active");
              link.setAttribute("aria-current", "page");
            }
          });
        }

        // Handle global keydown events
        function handleGlobalKeydown(e) {
          // Close menu with Escape key
          if (e.key === "Escape" && sideNav.classList.contains("active")) {
            closeSideNav();
          }
        }

        // Show notification
        function showNotification(message) {
          const notification = document.createElement("div");
          notification.className = "notification";
          notification.textContent = message;
          notification.setAttribute("role", "alert");

          Object.assign(notification.style, {
            position: "fixed",
            top: "50%",
            left: "50%",
            transform: "translate(-50%, -50%)",
            backgroundColor: "#000",
            color: "#fff",
            padding: "12px 24px",
            borderRadius: "8px",
            zIndex: "10000",
            fontSize: "14px",
            textAlign: "center",
            opacity: "0",
            transition: "opacity 0.3s ease",
          });

          document.body.appendChild(notification);

          setTimeout(() => {
            notification.style.opacity = "1";
          }, 10);

          setTimeout(() => {
            notification.style.opacity = "0";
            setTimeout(() => {
              if (notification.parentNode) {
                notification.parentNode.removeChild(notification);
              }
            }, 300);
          }, 3000);
        }

        // Initialize app when DOM is ready
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
